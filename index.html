<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SELT.OS — Local Learning Desktop</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link rel="stylesheet" href="css/windows.css" />
    <link rel="stylesheet" href="css/dock.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="wallpaper"></div>

    <header class="topbar">
      <div class="workspaces" id="workspaces">
        <button class="workspace active" data-workspace="1">1</button>
        <button class="workspace" data-workspace="2">2</button>
        <button class="workspace" data-workspace="3">3</button>
        <button class="workspace" data-workspace="4">4</button>
      </div>
      <div class="topbar-center">
        <span class="brand-mark">◈</span>
        <span>SELT.OS</span>
      </div>
      <div class="system-info">
        <span class="dot"></span>
        <span id="clock">00:00</span>
        <div class="theme-switcher" role="group" aria-label="Theme">
          <button
            class="sw-dracula"
            data-theme-set="dracula"
            title="Dracula"
            aria-label="Dracula"
          ></button>
          <button
            class="sw-nord"
            data-theme-set="nord"
            title="Nord"
            aria-label="Nord"
          ></button>
          <button
            class="sw-green"
            data-theme-set="green"
            title="Green"
            aria-label="Green"
          ></button>
        </div>
      </div>
    </header>

    <main id="desktop" class="desktop">
      <section class="welcome-card">
        <header class="hud-head">
          <div class="hud-brand">
            <span class="hud-mark">◈</span>
            <span class="hud-name">SELT.OS</span>
          </div>
          <span class="hud-version">v1.0 · local</span>
        </header>

        <div class="hud-status">
          <span class="hud-dot"></span>
          <span id="hudStatus">Ready · no windows open</span>
        </div>

        <div class="hud-stats">
          <div class="hud-stat">
            <span class="hud-stat-label">WORKSPACE</span>
            <span class="hud-stat-value" id="hudWs">1 / 4</span>
          </div>
          <div class="hud-stat">
            <span class="hud-stat-label">WINDOWS</span>
            <span class="hud-stat-value" id="hudWins">0</span>
          </div>
          <div class="hud-stat">
            <span class="hud-stat-label">THEME</span>
            <span class="hud-stat-value" id="hudTheme">Dracula</span>
          </div>
        </div>

        <div class="hud-hint">
          <kbd>Super</kbd><kbd>H</kbd><span>for all shortcuts</span>
        </div>
      </section>

      <section class="pinned-cluster">
        <button class="pinned-tile" data-action="environments">
          <span class="pin-glyph">◆</span>
          <span class="pin-body">
            <strong>Environments</strong>
            <small>Guided labs</small>
          </span>
          <span class="pin-key"><kbd>N</kbd></span>
        </button>

        <button class="pinned-tile" data-action="apps">
          <span class="pin-glyph">▲</span>
          <span class="pin-body">
            <strong>Applications</strong>
            <small>Launcher</small>
          </span>
          <span class="pin-key"><kbd>D</kbd></span>
        </button>

        <button class="pinned-tile" data-action="terminal">
          <span class="pin-glyph">❯_</span>
          <span class="pin-body">
            <strong>Terminal</strong>
            <small>Shell</small>
          </span>
          <span class="pin-key"><kbd>K</kbd></span>
        </button>

        <button class="pinned-tile" data-action="settings">
          <span class="pin-glyph">⚙</span>
          <span class="pin-body">
            <strong>Settings</strong>
            <small>Preferences</small>
          </span>
          <span class="pin-key"><kbd>S</kbd></span>
        </button>
      </section>
    </main>

    <div id="windowLayer"></div>
    <div id="dock" class="dock" aria-label="Application dock">
      <div class="dock-items" id="dockItems"></div>
      <div class="dock-sep" id="dockSepDynamic" style="display: none"></div>
      <div class="dock-items" id="dockDynamic" style="display: none"></div>
      <div class="dock-sep"></div>
      <button
        class="dock-item dock-show-apps"
        data-action="apps"
        title="Show Applications"
      >
        <span class="dock-icon">⊞</span>
      </button>
    </div>
    <div id="shortcuts" class="overlay-panel hidden">
      <div class="launcher-box">
        <div class="launcher-header">
          <div class="eyebrow">KEYBOARD SHORTCUTS</div>
          <button
            class="icon-btn"
            onclick="
              document.getElementById('shortcuts').classList.add('hidden')
            "
          >
            ×
          </button>
        </div>

        <div class="shortcut-groups">
          <!-- filled by Shortcuts.renderCheatSheet() -->
        </div>

        <div class="panel-hint">
          Inside a real desktop browser the OS may intercept
          <kbd>Super</kbd>+<kbd>X</kbd>. Use <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd
            >X</kbd
          >
          as the reliable mirror.
        </div>
      </div>
    </div>
    <div id="launcher" class="overlay-panel hidden">
      <div class="launcher-box">
        <div class="launcher-header">
          <span class="eyebrow">APPLICATIONS</span>
          <button class="icon-btn" data-close="launcher">×</button>
        </div>
        <input
          id="launcherSearch"
          class="launcher-search"
          placeholder="Search applications..."
          autocomplete="off"
        />
        <div id="appGrid" class="app-grid"></div>
        <div class="panel-hint">
          <kbd>Esc</kbd> close <span>•</span> <kbd>Enter</kbd> open
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
      (function () {
        const KEY = "hd-theme";
        const root = document.documentElement;

        const saved = localStorage.getItem(KEY) || "dracula";
        root.dataset.theme = saved;

        function sync() {
          document.querySelectorAll("[data-theme-set]").forEach((b) => {
            b.classList.toggle(
              "active",
              b.dataset.themeSet === root.dataset.theme,
            );
          });
        }
        document.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-theme-set]");
          if (!btn) return;
          root.dataset.theme = btn.dataset.themeSet;
          localStorage.setItem(KEY, btn.dataset.themeSet);
          sync();
        });
        sync();
      })();
    </script>
    <script src="js/window-manager.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/environments.js"></script>
    <script src="js/dock.js"></script>
  </body>
</html>
